<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>상한가 블록도</title>
<style>
:root{--bg:#1d3a5c;--ink:#f3efe6;--dim:#a9b3c7;--gold:#f2c14e;--panel:rgba(11,14,26,.88)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100vw - 24px)}
.hud b{font-size:18px}.hud small{color:var(--dim)}
.btn{background:var(--panel);border:2px solid #3a4778;color:var(--ink);padding:6px 10px;border-radius:6px;font-size:14px;cursor:pointer;user-select:none}
.btn.on{border-color:var(--gold);color:var(--gold)}
#ask,#fast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:12px 16px;display:none;max-width:calc(100vw - 32px)}
#ask p{margin:0 0 10px;font-size:16px}#fast{bottom:auto;top:58px;left:12px;transform:none}#fast .btn{display:block;margin:4px 0;width:100%;text-align:left}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.note{position:fixed;right:12px;bottom:12px;color:var(--dim);font-size:12px;text-align:right;max-width:46vw}
</style></head><body>
<canvas id="cv"></canvas>
<div class="hud"><b id="rg"></b><small id="walked"></small><span class="btn" id="bOver">전체 보기</span><span class="btn" id="bFast">바로 가기 ▾</span><span class="btn" id="bGrid">칸</span></div>
<div id="fast"></div><div id="ask"></div><div id="fade"></div>
<div class="note">블록도 · 누르면 걸어감 · 다리 끝에서 지역이 바뀜</div>
<script src="js/map2/iso.js"></script><script src="js/map2/kinds.js"></script><script src="js/map2/regions.js"></script><script src="js/map2/traffic.js"></script><script src="js/map2/check.js"></script><script src="js/map2/render.js"></script>
<script>
(function () {
  const PL = { office_sales: '영업부', office_corridor: '복도', hr_board: '인사팀 게시판', cafeteria: '구내식당', cafe_press: '신문사 앞 카페', trading_floor: '객장', research_center: '리서치센터', press_room: '기자실', bar_yujin: "바 '유진'", hotel_bar_door: '호텔 바 문 앞', tailor: '양복점', han_river: '한강 둔치', market: '영등포 시장', home_studio: '자취방', client_office: '덕산정밀' };
  const COL = { water: '#3b6fa8', road: '#5a5f69', side: '#bdb6a6', plaza: '#d3cab6', grass: '#7fae6a', bank: '#cdbd8c', cross: '#e9e6dc', bridge: '#8f7f6b', site: '#9c8a6a', vacant: '#a7946b' };
  const SPEED = M2.C.WALK_SPEED, HERO_H = M2.C.HERO_H, SHEET = M2.C.HSHEET;   // 상수는 map2/iso.js M2.C 한 곳
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const R = {}; for (const id in M2.REGIONS) R[id] = M2.build(M2.REGIONS[id]);
  const sheet = new Image(); sheet.src = SHEET.src;
  // 그리기는 js/map2/render.js(본 게임 지도와 같음) · 기본은 낱장 · ?skin=0 이면 블록도 처음 꼴(상자)
  const SKIN = new URLSearchParams(location.search).get('skin') !== '0';
  M2.R2.init({ skin: SKIN, edge: new URLSearchParams(location.search).get('edge') === '0' ? 0 : 1 });   // 67: 바깥 경계(판처럼 잘라 냄) · ?edge=0 이면 예전 물빛 바탕
  const HS = SKIN ? M2.HERO_SCALE : 1;
  const S = { r: null, pos: [0, 0], dir: 'SE', path: null, frame: 0, step: 0, over: false, grid: false, zoom: 1, cam: [0, 0], walked: 0, onExit: false, visited: {}, ground: null };
  let DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize() { cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; }
  addEventListener('resize', resize); resize();

  function drawGround(r) { const a = s2w([0, 0]), b = s2w([innerWidth, innerHeight]); M2.R2.drawGround(ctx, r, [a[0], a[1], b[0], b[1]]); }
  function enter(id, entrance) {
    if (S.r && S.r.id !== id) M2.R2.drop(S.r);   // 떠난 지역의 조각은 비움
    S.r = R[id];
    const e = S.r.entrances.find(x => x.id === entrance) || S.r.entrances[0];
    S.pos = M2.toScreen(S.r, e.at[0], e.at[1]); S.path = null; S.onExit = true;
    document.getElementById('rg').textContent = S.r.ko; camTo(true);
  }
  function camTo(snap) {
    const vw = innerWidth, vh = innerHeight, r = S.r;
    if (S.over) { S.zoom = Math.min(vw / r.pxW, vh / r.pxH) * 0.95; S.cam = [r.pxW / 2, r.pxH / 2]; return; }
    if (S.free) return;   // 편집 화면: 카메라를 손으로 옮김
    S.zoom = vh < 520 ? 0.6 : vw < 700 ? 0.7 : 1;   // 휴대폰 가로(높이 낮음)는 더 멀리서
    const t = [S.pos[0], S.pos[1] - 40]; S.cam = M2.camEase(S.cam, t, snap);
  }
  const w2s = (p) => M2.toView(S, innerWidth, innerHeight, p), s2w = (p) => M2.fromView(S, innerWidth, innerHeight, p);   // 걷기 · 보는 틀 셈은 본 게임 지도와 같은 것(map2/iso.js)

  // 블록도 이름표 · 문 자리(본 게임은 HTML 이름표를 따로 씀)
  function label(b) {
    const r = S.r, top = M2.toScreen(r, b.x + b.w / 2, b.y + b.h / 2), y = M2.R2.bldTop(r, b), sk = M2.R2.ready(b.sprite);
    if (sk || b.places.length || b.old) {
      ctx.textAlign = 'center'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#1b1b1b'; ctx.fillText(b.name, top[0], sk ? y - 6 : y + 5);
      const sub = b.old ? '허름함 · 살 수 있음' : b.places.map(p => PL[p] || p).filter(t => t !== b.name).join(' · ');
      if (sub && !sk) { ctx.font = '12px sans-serif'; ctx.fillStyle = '#333'; ctx.fillText(sub, top[0], y + 21); }
    }
    if (b.places.length) { const d = M2.doorPt(r, b); ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.ellipse(d[0], d[1], 10, 5, 0, 0, 7); ctx.fill(); }
  }
  function drawHero() {
    const [x, y] = S.pos, h = HERO_H * HS, w = SHEET.cw * h / SHEET.ch;
    if (sheet.complete && sheet.naturalWidth) ctx.drawImage(sheet, S.frame * SHEET.cw, SHEET.rows[S.dir] * SHEET.ch, SHEET.cw, SHEET.ch, x - w / 2, y - h + 4, w, h);
    else { ctx.fillStyle = '#e33'; ctx.fillRect(x - 6, y - 30, 12, 30); }
  }
  function draw() {
    const r = S.r; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = M2.R2.bg(); ctx.fillRect(0, 0, cv.width, cv.height);
    const o = w2s([0, 0]); ctx.setTransform(S.zoom * DPR, 0, 0, S.zoom * DPR, o[0] * DPR, o[1] * DPR);
    drawGround(r);
    if (S.grid) { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; for (let i = 0; i <= r.W; i++) { const a = M2.toScreen(r, i, 0), b = M2.toScreen(r, i, r.H); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } for (let j = 0; j <= r.H; j++) { const a = M2.toScreen(r, 0, j), b = M2.toScreen(r, r.W, j); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } }
    r.exits.forEach(e => e.cells.forEach(c => { const p = M2.toScreen(r, c[0] + 0.5, c[1] + 0.5); ctx.fillStyle = 'rgba(242,193,78,.9)'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('▶ ' + M2.REGIONS[e.to.region].ko, p[0], p[1]); }));
    if (S.path) { ctx.strokeStyle = 'rgba(242,193,78,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(S.pos[0], S.pos[1]); S.path.forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke(); }
    // 깊이: 건물 · 사물 · 주인공을 발자국 상자로 위상 정렬(설계 3-5 · render.js)
    const hc = M2.toCell(r, S.pos[0], S.pos[1]);
    const heroIt = { x0: hc[0] - 0.15, y0: hc[1] - 0.15, x1: hc[0] + 0.15, y1: hc[1] + 0.15, sb: [S.pos[0] - 18 * HS, S.pos[1] - HERO_H * HS, S.pos[0] + 18 * HS, S.pos[1]], draw: drawHero };
    // 64: 움직이는 차(?traf=대수 · 기본 8 · 0 이면 끔 · &trafms=미리 굴릴 ms) — 본 게임과 같은 traffic.js
    if (S.traf && S.trafR !== r.id) S.traf = null;
    if (!S.traf && TRAF) { const srnd = M2.seeded(20261113);
      S.traf = M2.trafficMake(r, TRAF, srnd); S.trafR = r.id; for (let t = 0; t < TRAFMS; t += 16) M2.trafficStep(S.traf, r, 16, [hc]); }
    const cars = S.traf ? S.traf.cars.filter(c => !c.out).map(c => M2.R2.carItem(ctx, r, c)).filter(Boolean) : [];
    M2.R2.drawScene(ctx, r, { label, extra: [heroIt].concat(cars), focus: heroIt, sigT: S.traf ? S.traf.t : 0 });
    if (window.BLOCK && BLOCK.edit) BLOCK.edit.drawOver(ctx);
    r.blds.filter(b => b.area).forEach(b => { const d = M2.doorPt(r, b); ctx.fillStyle = '#1b1b1b'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(b.name, d[0], d[1] - 14); ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.ellipse(d[0], d[1], 10, 5, 0, 0, 7); ctx.fill(); });
  }
  const TQ = new URLSearchParams(location.search), TRAF = TQ.get('traf') == null ? 8 : +TQ.get('traf'), TRAFMS = +(TQ.get('trafms') || 0);
  // 걷기
  let last = performance.now(), target = null;
  function tick(now) {
    const dt = Math.min(50, now - last); last = now;
    advance(dt);
    document.getElementById('walked').textContent = `걸은 시간 ${(S.walked / SPEED / 1000).toFixed(1)}초`;
    camTo(false); draw(); requestAnimationFrame(tick);
  }
  function advance(dt) {   // 걷기 계산(그리기와 따로 — 시험이 시간을 직접 흘릴 수 있게)
    if (S.traf && S.trafR === S.r.id) M2.trafficStep(S.traf, S.r, dt, [M2.toCell(S.r, S.pos[0], S.pos[1])]);
    if (S.path && S.path.length) {
      M2.walkAlong(S, SPEED * dt, 0.5);
      S.step += SPEED * dt; S.frame = 1 + (Math.floor(S.step / 18) % 4);
      if (!S.path.length) { S.path = null; S.frame = 0; arrive(); }
      checkExit();
    }
  }
  function checkExit() {
    const e = M2.exitAt(S.r, S.pos);
    if (!e) { S.onExit = false; return; }
    if (S.onExit) return;   // 넘어오자마자 다시 넘어가지 않게
    const f = document.getElementById('fade'); f.style.opacity = 1; S.path = null;
    if (window.BLOCK && BLOCK.instant) { enter(e.to.region, e.to.entrance); f.style.opacity = 0; } else setTimeout(() => { enter(e.to.region, e.to.entrance); f.style.opacity = 0; }, 260);
  }
  function arrive() {
    if (!target || !target.places.length) return;
    target.places.forEach(p => { S.visited[p] = { region: S.r.id, id: target.id }; });
    const a = document.getElementById('ask');
    a.innerHTML = `<p><b>${target.name}</b> — 들어갈까?</p><span class="btn" data-k="in">들어간다</span> <span class="btn" data-k="no">돌아선다</span>`;
    a.style.display = 'block';
  }
  document.getElementById('ask').addEventListener('click', (ev) => { const k = ev.target.dataset.k; if (!k) return; const a = document.getElementById('ask');
    if (k === 'in') { a.innerHTML = '<p>(블록도) 장소 안 화면은 피드백 48번에서 — 여기선 문 앞까지만.</p><span class="btn" data-k="no">닫기</span>'; return; } a.style.display = 'none'; });
  function walkTo(world, bld) {
    target = bld || null; document.getElementById('ask').style.display = 'none';
    const to = bld ? M2.doorPt(S.r, bld) : world;
    const P = M2.pathTo(S.r, S.pos, to);
    if (!P) { flash('거기는 갈 수 없어요'); return; }
    S.path = P; if (!P.length) arrive();
  }
  const bldAt = (w) => M2.R2.bldAt(S.r, w);   // 지붕 · 벽까지 누름
  let msgT = 0; function flash(t) { const n = document.querySelector('.note'); n.dataset.o = n.dataset.o || n.textContent; n.textContent = t; clearTimeout(msgT); msgT = setTimeout(() => { n.textContent = n.dataset.o; }, 1400); }
  cv.addEventListener('pointerdown', (ev) => {
    if (window.BLOCK && BLOCK.edit && BLOCK.edit.down(ev)) return;   // 편집 화면이 먼저 받음
    if (S.over) { S.over = false; document.getElementById('bOver').classList.remove('on'); }
    const w = s2w([ev.clientX, ev.clientY]), b = bldAt(w);
    if (b && (b.places.length || b.old)) walkTo(null, b); else walkTo(w, null);
  });
  document.getElementById('bOver').onclick = (e) => { S.over = !S.over; e.target.classList.toggle('on', S.over); camTo(true); };
  document.getElementById('bGrid').onclick = (e) => { S.grid = !S.grid; e.target.classList.toggle('on', S.grid); };
  document.getElementById('bFast').onclick = () => {
    const f = document.getElementById('fast'); if (f.style.display === 'block') { f.style.display = 'none'; return; }
    const ks = Object.keys(S.visited);
    f.innerHTML = ks.length ? ks.map(p => `<span class="btn" data-p="${p}">${PL[p] || p} <small>(${R[S.visited[p].region].ko})</small></span>`).join('') : '<small>아직 가 본 곳이 없어요 — 한 번 걸어서 가 보면 여기 생겨요</small>';
    f.style.display = 'block';
  };
  document.getElementById('fast').addEventListener('click', (ev) => { const p = ev.target.closest('[data-p]'); if (!p) return; const v = S.visited[p.dataset.p];
    if (v.region !== S.r.id) enter(v.region); const b = S.r.blds.find(x => x.id === v.id); S.pos = M2.doorPt(S.r, b); S.path = null; target = b; camTo(true);
    document.getElementById('fast').style.display = 'none'; arrive(); });
  const q = new URLSearchParams(location.search);   // 사진용: ?region=ydp · ?over=1
  enter(q.get('region') || 'yeouido', q.get('region') === 'ydp' ? 'home' : 'start');
  if (q.get('at')) { const [ax, ay] = q.get('at').split(',').map(Number); S.pos = M2.toScreen(S.r, ax + 0.5, ay + 0.5); camTo(true); }
  if (q.get('over')) { S.over = true; document.getElementById('bOver').classList.add('on'); camTo(true); }
  requestAnimationFrame(tick);
  // 지역 자료(M2.REGIONS)를 고친 뒤 다시 만듦 — 편집 화면이 씀 · 조각도 새로 구움
  function rebuild(id) { R[id] = M2.build(M2.REGIONS[id]); if (S.r && S.r.id === id) S.r = R[id]; }
  window.BLOCK = { S, R, walkTo, bldAt, enter, rebuild, w2s, s2w, camTo, flash, sim: (ms) => { for (let t = 0; t < ms; t += 16) advance(16); } };   // 시험용(sim = 시간 흘리기) · 편집 화면
})();
</script><script src="js/map2/editor.js"></script></body></html>
